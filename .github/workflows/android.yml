name: Android CI Build and Test

on:
  push:
    branches: [ "feature/lrgetbd-phase1", "main" ]
  pull_request:
    branches: [ "feature/lrgetbd-phase1", "main" ]

jobs:
  build:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew (if present)
      run: if [ -f gradlew ]; then chmod +x gradlew; fi

    - name: Run Unit & Robolectric Tests
      run: gradle :app:testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LRgetBD-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
