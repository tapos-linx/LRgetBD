name: Android CI Build, Test & Release

on:
  push:
    branches: [ "feature/lrgetbd-phase1", "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "feature/lrgetbd-phase1", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Publish APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Run Unit & Robolectric Tests
      run: gradle :app:testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Rename APK for One-Click User Download
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/LRgetBD-latest.apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/app-debug.apk

    - name: Upload Debug APK Artifact (Actions)
      uses: actions/upload-artifact@v4
      with:
        name: LRgetBD-apk
        path: release-apk/
        if-no-files-found: error

    - name: Publish / Update GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "LRgetBD Latest Android APK"
        body: |
          ## 📱 LRgetBD — Android Land Record Downloader
          
          ### 📥 1-Click Phone Installation
          Download and install the APK on your Android phone:
          - **[Download LRgetBD-latest.apk](https://github.com/tapos-linx/LRgetBD/releases/latest/download/LRgetBD-latest.apk)**
          - **[Download app-debug.apk](https://github.com/tapos-linx/LRgetBD/releases/latest/download/app-debug.apk)**
          
          ### Requirements & Notes
          - Android 7.0+ (API 24 through 36)
          - Offline-first Room database and Storage Access Framework
          - SHA-256 cryptographic PDF validation
        files: |
          release-apk/LRgetBD-latest.apk
          release-apk/app-debug.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
